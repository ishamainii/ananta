<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="site-root" content="../../">
<!-- generated by tools/make_pages.py from page.json + notes.html; edit those, not this file -->
<title>$name · Ananta</title>
<meta name="description" content="$description">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="../../css/site.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas class="stage" id="stage" aria-label="$aria"></canvas>
<canvas class="stage ink" id="ink" aria-hidden="true"></canvas>

<header class="topbar">
  <a class="mark" href="../../"><b lang="sa">अनन्त</b><span>ANANTA</span></a>
  <nav class="crumbs"><a href="../../#chambers">chambers</a><a aria-current="page">$num · $short</a></nav>
</header>

<div class="readout" id="ro"></div>

<div class="caption" aria-live="polite">
  <div class="line" id="cap1"></div>
  <div class="big" id="cap2"></div>
</div>

<div class="dock">
  $dock
  <span class="sep"></span>
  <label class="chip trip" title="How loud the psychedelic layer is">trip <input id="trip" type="range" min="0" max="100" value="$trip"></label>
  <button class="chip" id="soundBtn" aria-pressed="false">♪ sound</button>
  <button class="chip" id="guideBtn" aria-pressed="false" title="Ask the guide (g)">✦ ask</button>
  <button class="chip" id="notesBtn" aria-pressed="false" title="Notebook (n)">notebook</button>
</div>

<aside class="notebook" id="notebook" aria-label="Notebook">
  <button class="chip close" aria-label="Close notebook">close ✕</button>
$notes
  <h3>Sources</h3>
  <ol class="sources" id="sources"></ol>
</aside>

<div class="veil" id="veil">
  <div class="eyebrow">chamber $num · $short</div>
  <h1 lang="sa">$deva</h1>
  <div class="sub">$sub</div>
  <p>$intro</p>
  <div class="go"><button class="chip primary" id="begin">begin with sound ✦</button><button class="chip" id="silent">enter in silence</button></div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
